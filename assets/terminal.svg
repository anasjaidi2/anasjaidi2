<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Animated developer terminal with programming content">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10141b"/><stop offset=".5" stop-color="#8fe7ff" stop-opacity=".45"/><stop offset="1" stop-color="#10141b"/></linearGradient>
  <clipPath id="l1"><rect x="62" y="0" width="0" height="340"><animate attributeName="width" values="0;960;960;960" keyTimes="0;.26;.33;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l2"><rect x="62" y="0" width="0" height="340"><animate attributeName="width" values="0;0;0;960;960" keyTimes="0;.22;.28;.53;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l3"><rect x="62" y="0" width="0" height="340"><animate attributeName="width" values="0;0;0;0;960;960" keyTimes="0;.44;.5;.74;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l4"><rect x="62" y="0" width="0" height="340"><animate attributeName="width" values="0;0;0;0;0;960;960" keyTimes="0;.66;.72;.76;.94;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect x="2" y="2" width="1096" height="336" rx="14" fill="#050608" stroke="url(#edge)" stroke-width="1.6"/>
<rect x="3" y="3" width="1094" height="46" rx="12" fill="#090b10"/>
<circle cx="30" cy="26" r="6" fill="#646f7d"/><circle cx="52" cy="26" r="6" fill="#646f7d"/><circle cx="74" cy="26" r="6" fill="#646f7d"/>
<text x="550" y="31" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#92a0b0">anas@blackout: ~/builds</text>
<text x="62" y="82" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" letter-spacing="2">// PROGRAMMING LOG</text>
<g font-family="Consolas,DejaVu Sans Mono,monospace" font-size="20">
  <g clip-path="url(#l1)"><text x="62" y="128" fill="#8fe7ff">$ <tspan fill="#f4f7fb">focus --now</tspan><tspan fill="#92a0b0">      backend development · APIs · databases · systems thinking</tspan></text></g>
  <g clip-path="url(#l2)"><text x="62" y="182" fill="#5ca8ff">$ <tspan fill="#f4f7fb">mindset --active</tspan><tspan fill="#92a0b0">   curious, strategic, calm under pressure, always learning</tspan></text></g>
  <g clip-path="url(#l3)"><text x="62" y="236" fill="#9386ff">$ <tspan fill="#f4f7fb">method --solve</tspan><tspan fill="#92a0b0">      break the problem down → test → debug → refine</tspan></text></g>
  <g clip-path="url(#l4)"><text x="62" y="290" fill="#8fe7ff">$ <tspan fill="#f4f7fb">status</tspan><tspan fill="#92a0b0">             no finish line, just the next good question</tspan></text></g>
</g>
<rect x="61" y="304" width="9" height="3" fill="#8fe7ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>