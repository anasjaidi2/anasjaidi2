<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="Animated rotating quotes panel 2"><defs><linearGradient id="edge1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a0c10"/><stop offset=".5" stop-color="#8fe7ff" stop-opacity=".35"/><stop offset="1" stop-color="#0a0c10"/></linearGradient></defs><rect x="2" y="2" width="1096" height="236" rx="14" fill="#050608" stroke="url(#edge1)" stroke-width="1.6"/><text x="34" y="30" font-family="Consolas,monospace" font-size="13" fill="#92a0b0" letter-spacing="2">// ROTATING QUOTES [2/3]</text><line x1="34" y1="42" x2="1066" y2="42" stroke="#131921"/><clipPath id="q1_0"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="0.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_0)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“Everything is connected.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="0.0s" repeatCount="indefinite"/>// Dark  ·  H. G. Tannhaus  ·  D1</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="0.0s" repeatCount="indefinite"/></rect><clipPath id="q1_1"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="5.6s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_1)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#dfe7ef"><tspan x="40" dy="0">“We&#x27;re not free in what we do, because we&#x27;re not free in</tspan><tspan x="40" dy="38">what we want.”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="5.6s" repeatCount="indefinite"/>// Dark  ·  The Stranger  ·  D2</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="5.6s" repeatCount="indefinite"/></rect><clipPath id="q1_2"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="11.2s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_2)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“The beginning is the end, and the end is the beginning.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="11.2s" repeatCount="indefinite"/>// Dark  ·  Eva  ·  D3</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="11.2s" repeatCount="indefinite"/></rect><clipPath id="q1_3"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="16.799999999999997s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_3)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#9386ff">“Revenge is a poison.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="16.799999999999997s" repeatCount="indefinite"/>// The Mentalist  ·  Patrick Jane  ·  M1</text><rect x="40" y="198" width="0" height="2.4" fill="#9386ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="16.799999999999997s" repeatCount="indefinite"/></rect><clipPath id="q1_4"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="22.4s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_4)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“There&#x27;s no such thing as psychics.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="22.4s" repeatCount="indefinite"/>// The Mentalist  ·  Patrick Jane  ·  M2</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="22.4s" repeatCount="indefinite"/></rect><clipPath id="q1_5"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="28.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_5)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#dfe7ef"><tspan x="40" dy="0">“When you&#x27;re dead you&#x27;re dead, and until then, there&#x27;s ice</tspan><tspan x="40" dy="38">cream.”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="28.0s" repeatCount="indefinite"/>// The Mentalist  ·  Patrick Jane  ·  M3</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="28.0s" repeatCount="indefinite"/></rect><clipPath id="q1_6"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="33.599999999999994s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_6)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“Chaos isn&#x27;t a pit. Chaos is a ladder.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="33.599999999999994s" repeatCount="indefinite"/>// Game of Thrones  ·  Petyr Baelish  ·  G1</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="33.599999999999994s" repeatCount="indefinite"/></rect><clipPath id="q1_7"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="39.199999999999996s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_7)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#9386ff">“A mind needs books as a sword needs a whetstone.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="39.199999999999996s" repeatCount="indefinite"/>// Game of Thrones  ·  Tyrion Lannister  ·  G2</text><rect x="40" y="198" width="0" height="2.4" fill="#9386ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="39.199999999999996s" repeatCount="indefinite"/></rect><clipPath id="q1_8"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="44.8s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_8)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“Power resides where men believe it resides.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="44.8s" repeatCount="indefinite"/>// Game of Thrones  ·  Varys  ·  G3</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="44.8s" repeatCount="indefinite"/></rect><clipPath id="q1_9"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="50.4s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q1_9)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#dfe7ef">“The man who passes the sentence should swing the sword.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="50.4s" repeatCount="indefinite"/>// Game of Thrones  ·  Ned Stark  ·  G4</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="50.4s" repeatCount="indefinite"/></rect></svg>