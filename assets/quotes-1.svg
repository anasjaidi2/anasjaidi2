<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="Animated rotating quotes panel 1"><defs><linearGradient id="edge0" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a0c10"/><stop offset=".5" stop-color="#8fe7ff" stop-opacity=".35"/><stop offset="1" stop-color="#0a0c10"/></linearGradient></defs><rect x="2" y="2" width="1096" height="236" rx="14" fill="#050608" stroke="url(#edge0)" stroke-width="1.6"/><text x="34" y="30" font-family="Consolas,monospace" font-size="13" fill="#92a0b0" letter-spacing="2">// ROTATING QUOTES [1/3]</text><line x1="34" y1="42" x2="1066" y2="42" stroke="#131921"/><clipPath id="q0_0"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="0.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_0)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“If you don&#x27;t fight, you can&#x27;t win.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="0.0s" repeatCount="indefinite"/>// Attack on Titan  ·  Eren Yeager  ·  A1</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="0.0s" repeatCount="indefinite"/></rect><clipPath id="q0_1"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="5.6s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_1)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#dfe7ef">“This world is cruel, but it&#x27;s also very beautiful.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="5.6s" repeatCount="indefinite"/>// Attack on Titan  ·  Mikasa Ackerman  ·  A2</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="5.6s" repeatCount="indefinite"/></rect><clipPath id="q0_2"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="11.2s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_2)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“Everyone had to be drunk on somethin&#x27; to keep pushing on.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="11.2s" repeatCount="indefinite"/>// Attack on Titan  ·  Kenny Ackerman  ·  A3</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="11.2s" repeatCount="indefinite"/></rect><clipPath id="q0_3"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="16.799999999999997s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_3)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#9386ff"><tspan x="40" dy="0">“My soldiers, rage! My soldiers, scream! My soldiers,</tspan><tspan x="40" dy="38">fight!”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="16.799999999999997s" repeatCount="indefinite"/>// Attack on Titan  ·  Erwin Smith  ·  A4</text><rect x="40" y="198" width="0" height="2.4" fill="#9386ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="16.799999999999997s" repeatCount="indefinite"/></rect><clipPath id="q0_4"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="22.4s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_4)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“I was born into this world.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="22.4s" repeatCount="indefinite"/>// Attack on Titan  ·  Eren Yeager  ·  A5</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="22.4s" repeatCount="indefinite"/></rect><clipPath id="q0_5"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="28.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_5)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#dfe7ef">“People&#x27;s dreams never end!”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="28.0s" repeatCount="indefinite"/>// One Piece  ·  Marshall D. Teach  ·  O1</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="28.0s" repeatCount="indefinite"/></rect><clipPath id="q0_6"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="33.599999999999994s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_6)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“When do you think people die? When they are forgotten.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="33.599999999999994s" repeatCount="indefinite"/>// One Piece  ·  Dr. Hiriluk  ·  O2</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="33.599999999999994s" repeatCount="indefinite"/></rect><clipPath id="q0_7"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="39.199999999999996s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_7)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#9386ff">“I want to live!”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="39.199999999999996s" repeatCount="indefinite"/>// One Piece  ·  Nico Robin  ·  O3</text><rect x="40" y="198" width="0" height="2.4" fill="#9386ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="39.199999999999996s" repeatCount="indefinite"/></rect><clipPath id="q0_8"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="44.8s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_8)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“Nothing happened.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="44.8s" repeatCount="indefinite"/>// One Piece  ·  Roronoa Zoro  ·  O4</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="44.8s" repeatCount="indefinite"/></rect><clipPath id="q0_9"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="56.0s" begin="50.4s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q0_9)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#dfe7ef">“Thank you... for loving me!”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="56.0s" begin="50.4s" repeatCount="indefinite"/>// One Piece  ·  Portgas D. Ace  ·  O5</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="56.0s" begin="50.4s" repeatCount="indefinite"/></rect></svg>