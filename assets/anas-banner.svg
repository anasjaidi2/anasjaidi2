<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Anas Jaidi — Curious by nature, problem solver by choice</title>
<desc id="desc">Dark cinematic banner with gold tiger illustration, subdued green accents, and clear typography.</desc>
