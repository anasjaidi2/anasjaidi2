<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="Animated rotating quotes panel 3"><defs><linearGradient id="edge2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a0c10"/><stop offset=".5" stop-color="#8fe7ff" stop-opacity=".35"/><stop offset="1" stop-color="#0a0c10"/></linearGradient></defs><rect x="2" y="2" width="1096" height="236" rx="14" fill="#050608" stroke="url(#edge2)" stroke-width="1.6"/><text x="34" y="30" font-family="Consolas,monospace" font-size="13" fill="#92a0b0" letter-spacing="2">// ROTATING QUOTES [3/3]</text><line x1="34" y1="42" x2="1066" y2="42" stroke="#131921"/><clipPath id="q2_0"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="0.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_0)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“In the pursuit of great, we failed to do good.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="0.0s" repeatCount="indefinite"/>// Arcane  ·  Viktor  ·  R1</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="0.0s" repeatCount="indefinite"/></rect><clipPath id="q2_1"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="5.6s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_1)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#dfe7ef">“There is no prize to perfection, only an end to pursuit.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="5.6s" repeatCount="indefinite"/>// Arcane  ·  Viktor  ·  R2</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="5.6s" repeatCount="indefinite"/></rect><clipPath id="q2_2"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="11.2s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_2)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“What makes you different makes you strong.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="11.2s" repeatCount="indefinite"/>// Arcane  ·  Vi  ·  R3</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="11.2s" repeatCount="indefinite"/></rect><clipPath id="q2_3"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="16.799999999999997s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_3)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#9386ff"><tspan x="40" dy="0">“When you&#x27;re going to change the world, don&#x27;t ask for</tspan><tspan x="40" dy="38">permission.”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="16.799999999999997s" repeatCount="indefinite"/>// Arcane  ·  Viktor  ·  R4</text><rect x="40" y="198" width="0" height="2.4" fill="#9386ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="16.799999999999997s" repeatCount="indefinite"/></rect><clipPath id="q2_4"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="22.4s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_4)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#8fe7ff">“Talk is cheap. Show me the code.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="22.4s" repeatCount="indefinite"/>// Linus Torvalds  ·  Real quote  ·  P1</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="22.4s" repeatCount="indefinite"/></rect><clipPath id="q2_5"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="28.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_5)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#dfe7ef">“What I cannot create, I do not understand.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="28.0s" repeatCount="indefinite"/>// Richard Feynman  ·  Real quote  ·  P2</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="28.0s" repeatCount="indefinite"/></rect><clipPath id="q2_6"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="33.599999999999994s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_6)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“The first principle is that you must not fool yourself.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="33.599999999999994s" repeatCount="indefinite"/>// Richard Feynman  ·  Real quote  ·  P3</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="33.599999999999994s" repeatCount="indefinite"/></rect><clipPath id="q2_7"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="39.199999999999996s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_7)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#9386ff"><tspan x="40" dy="0">“We can only see a short distance ahead, but we</tspan><tspan x="40" dy="38">can see plenty there that needs to be done.”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="39.199999999999996s" repeatCount="indefinite"/>// Alan Turing  ·  Real quote  ·  P4</text><rect x="40" y="198" width="0" height="2.4" fill="#9386ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="39.199999999999996s" repeatCount="indefinite"/></rect><clipPath id="q2_8"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="44.8s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_8)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#8fe7ff"><tspan x="40" dy="0">“If we have our own why in life, we shall get</tspan><tspan x="40" dy="38">along with almost any how.”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="44.8s" repeatCount="indefinite"/>// Friedrich Nietzsche  ·  Real quote  ·  P5</text><rect x="40" y="198" width="0" height="2.4" fill="#8fe7ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="44.8s" repeatCount="indefinite"/></rect><clipPath id="q2_9"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="50.4s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_9)" x="40" y="92" font-family="Georgia,serif" font-size="28" fill="#dfe7ef"><tspan x="40" dy="0">“In the depths of winter, I finally learned that</tspan><tspan x="40" dy="38">within me there lay an invincible summer.”</tspan></text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="50.4s" repeatCount="indefinite"/>// Albert Camus  ·  Real quote  ·  P6</text><rect x="40" y="198" width="0" height="2.4" fill="#dfe7ef" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="50.4s" repeatCount="indefinite"/></rect><clipPath id="q2_10"><rect x="40" y="0" width="0" height="240"><animate attributeName="width" values="0;980;980;0;0" keyTimes="0;.14;.72;.8;1" dur="61.6s" begin="56.0s" repeatCount="indefinite"/></rect></clipPath><text clip-path="url(#q2_10)" x="40" y="106" font-family="Georgia,serif" font-size="31" fill="#5ca8ff">“The universe is change; life is opinion.”</text><text x="42" y="185" font-family="Consolas,monospace" font-size="14" fill="#92a0b0" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.72;.8;1" dur="61.6s" begin="56.0s" repeatCount="indefinite"/>// Marcus Aurelius  ·  Real quote  ·  P7</text><rect x="40" y="198" width="0" height="2.4" fill="#5ca8ff" opacity=".85"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;.25;.72;.8;1" dur="61.6s" begin="56.0s" repeatCount="indefinite"/></rect></svg>