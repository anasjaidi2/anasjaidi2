<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="t d">
<title id="t">Anas Jaidi — BLACKOUT</title>
<desc id="d">Nearly pure-black animated banner with subtle blue highlights, multiple scan effects, and bold typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#010101"/><stop offset=".55" stop-color="#050608"/><stop offset="1" stop-color="#080b10"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dfe7ef"/><stop offset=".55" stop-color="#8fe7ff"/><stop offset="1" stop-color="#9386ff"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#8fe7ff" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#5ca8ff" stop-opacity=".22"/><stop offset=".6" stop-color="#9386ff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#293140" stroke-opacity=".18" stroke-width=".8"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="round"><rect width="1100" height="340" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1100" height="340" fill="url(#bg)"/>
  <rect width="1100" height="340" fill="url(#grid)"/>
  <circle cx="870" cy="144" r="230" fill="url(#halo)"><animate attributeName="opacity" values=".45;.95;.45" dur="8s" repeatCount="indefinite"/></circle>
  <rect x="-320" y="0" width="260" height="340" fill="url(#scan)"><animate attributeName="x" values="-320;1140" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="0" y="0" width="1100" height="340" fill="none" stroke="#1b2430" stroke-width="2"/>
  <g stroke="#8fe7ff" stroke-opacity=".45" fill="none" stroke-width="1.2">
    <path d="M36 34h56M36 34v56M1064 34h-56M1064 34v56M36 306h56M36 306v-56M1064 306h-56M1064 306v-56"/>
  </g>
  <g font-family="Consolas,monospace" font-size="12" letter-spacing="2.6" fill="#92a0b0">
    <text x="60" y="60">BLACKOUT // PROFILE // 003</text>
    <text x="774" y="60">OBSERVE / QUESTION / SOLVE</text>
  </g>
  <g transform="translate(62,0)">
    <text x="0" y="162" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#f4f7fb" opacity="0">ANAS<animate attributeName="opacity" values="0;1;1" keyTimes="0;.3;1" dur="1.2s" fill="freeze"/></text>
    <text x="0" y="252" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="url(#name)" opacity="0">JAIDI<animate attributeName="opacity" values="0;1;1" keyTimes="0;.55;1" dur="1.8s" fill="freeze"/></text>
    <text x="4" y="289" font-family="Consolas,monospace" font-size="16" letter-spacing="1.5" fill="#92a0b0">curious by nature  //  problem solver by choice</text>
    <rect x="497" y="190" width="5" height="58" fill="#8fe7ff"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(846,160)">
    <circle r="86" fill="none" stroke="#9386ff" stroke-opacity=".45" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite"/></circle>
    <circle r="112" fill="none" stroke="#8fe7ff" stroke-opacity=".28" stroke-dasharray="1 16"><animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="50s" repeatCount="indefinite"/></circle>
    <path d="M-130 0Q0 -90 130 0Q0 90 -130 0Z" fill="#04070d" stroke="#5ca8ff" stroke-width="2.4"/>
    <path d="M-106 0Q0 -63 106 0Q0 63 -106 0Z" fill="#090f18" stroke="#8fe7ff" stroke-width="1.9"/>
    <circle r="34" fill="#020305" stroke="#dfe7ef" stroke-opacity=".35" stroke-width="4"/>
    <circle r="12" fill="#8fe7ff"><animate attributeName="r" values="12;17;12" dur="5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#020202"/>
    <path d="M-142 0H-102M102 0H142" stroke="#92a0b0" stroke-opacity=".6"/>
    <circle r="54" fill="none" stroke="#9386ff" stroke-opacity=".34" stroke-width="1.2"/>
  </g>
  <g opacity=".7">
    <path d="M62 314h164" stroke="#8fe7ff" stroke-width="2.2" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="8 160;160 8;8 160" dur="5s" repeatCount="indefinite"/></path>
  </g>
</g>
</svg>